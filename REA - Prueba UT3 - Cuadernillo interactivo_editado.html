<script>
(function(){
"use strict";
var E = EXAMEN, CLAVE = "rea-prueba-ut3-respuestas";
function $(s){ return document.querySelector(s); }
function ed(n,r){ n.setAttribute("data-e",r); return n; }
function el(t,a,h){ var n=document.createElement(t); if(a) for(var k in a) n.setAttribute(k,a[k]); if(h!=null) n.innerHTML=h; return n; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- construcción de la hoja ---------- */
var H = $("#hoja"), n = 0;
function campo(id, filas){ n++; var t=el("textarea",{"class":"resp","data-id":id,rows:filas||3}); return t; }

H.appendChild(ed(el("h1",null,esc(E.titulo)),"titulo"));
H.appendChild(ed(el("p",{"class":"sub"},esc(E.subtitulo)),"subtitulo"));

var id = el("div",{"class":"ident"});
["nombre","grupo","fecha"].forEach(function(c,i){
  var l=el("label",null,""); l.appendChild(ed(el("span",null,esc(E.rotulos.ident[i])),"rotulos.ident."+i));
  l.appendChild(el("input",{type:"text","data-id":"_"+c})); id.appendChild(l);
});
H.appendChild(id);

var cj=el("div",{"class":"caja"},""); 
cj.appendChild(ed(el("b",null,esc(E.rotulos.introEt)),"rotulos.introEt"));
cj.appendChild(document.createTextNode(" "));
cj.appendChild(ed(el("span",null,E.intro),"intro")); H.appendChild(cj);

H.appendChild(el("h2",null,"")).appendChild(ed(el("span",null,esc(E.rotulos.comoProyecta)),"rotulos.comoProyecta"));
var ol=el("ol"); E.pases.forEach(function(p,i){ ol.appendChild(ed(el("li",null,p),"pases."+i)); }); H.appendChild(ol);

H.appendChild(el("h2",null,"")).appendChild(ed(el("span",null,esc(E.rotulos.cuatroPartes)),"rotulos.cuatroPartes"));
var tb=el("table"), tr=el("tr");
E.rotulos.cabPartes.forEach(function(c,i){ tr.appendChild(ed(el("th",null,esc(c)),"rotulos.cabPartes."+i)); });
tb.appendChild(tr);
E.partes.forEach(function(p,i){
  var r=el("tr");
  r.appendChild(ed(el("td",{style:"padding:7px 9px;font-weight:700;text-align:center;width:9%"},esc(p[0])),"partes."+i+".0"));
  r.appendChild(ed(el("td",{style:"padding:7px 9px;font-size:15px"},p[1]),"partes."+i+".1"));
  r.appendChild(ed(el("td",{style:"padding:7px 9px;font-weight:700;text-align:center;width:12%"},esc(p[2])),"partes."+i+".2"));
  tb.appendChild(r);
});
H.appendChild(tb);

H.appendChild(el("h2",null,"")).appendChild(ed(el("span",null,esc(E.rotulos.queMirar)),"rotulos.queMirar"));
E.mirar.forEach(function(p,i){ H.appendChild(ed(el("p",null,p),"mirar."+i)); });
H.appendChild(ed(el("div",{"class":"caja av"},E.aviso),"aviso"));
H.appendChild(ed(el("div",{"class":"caja av noimp"},E.comoEntregar),"comoEntregar"));

H.appendChild(el("h2",{"class":"pr"},"")).appendChild(ed(el("span",null,esc(E.rotulos.losPlanos)),"rotulos.losPlanos"));
H.appendChild(ed(el("p",{"class":"n"},esc(E.rotulos.pieFotos)),"rotulos.pieFotos"));
var im=el("img",{"class":"fot",alt:"Hoja de fotogramas"}); im.src = window.__HOJA || ""; H.appendChild(im);

function cabecera(t,p,r){ var h=el("h2",{"class":"pr"},""); h.appendChild(ed(el("span",{style:"flex:1"},esc(t)),r+".titulo"));
  h.appendChild(ed(el("span",null,esc(p)),r+".puntos")); return h; }
function preg(c,p,txt,filas,r){
  var h=el("h3",null,""); h.appendChild(ed(el("span",{style:"flex:1"},esc(c)),r+".0"));
  h.appendChild(ed(el("span",null,esc(p)),r+".1"));
  H.appendChild(h); H.appendChild(ed(el("p",null,txt),r+".2")); H.appendChild(campo(c,filas||4));
}

/* Parte A */
H.appendChild(cabecera(E.parteA.titulo,E.parteA.puntos,"parteA"));
H.appendChild(ed(el("p",null,E.parteA.intro),"parteA.intro"));
var oa=el("ol"); E.parteA.pasos.forEach(function(p,i){ oa.appendChild(ed(el("li",null,p),"parteA.pasos."+i)); }); H.appendChild(oa);
H.appendChild(ed(el("p",null,E.parteA.cierre),"parteA.cierre"));

/* Parte B */
H.appendChild(cabecera(E.parteB.titulo,E.parteB.puntos,"parteB"));
H.appendChild(ed(el("p",null,E.parteB.intro),"parteB.intro"));
var tB=el("table",{id:"tB"}), trB=el("tr");
E.parteB.columnas.forEach(function(c,i){ trB.appendChild(ed(el("th",{style:"width:"+(E.parteB.anchos[i]||"25%")},esc(c)),"parteB.columnas."+i)); });
tB.appendChild(trB); H.appendChild(tB);
function filaB(k){
  var r=el("tr");
  for(var j=0;j<E.parteB.columnas.length;j++){
    var td=el("td"); td.appendChild(el("textarea",{"data-id":"B"+k+"_"+j,rows:1})); r.appendChild(td);
  }
  tB.appendChild(r);
}
for(var k=0;k<E.parteB.filas;k++) filaB(k);
var bMas=el("button",{"class":"noimp",style:"margin:4px 0 0"},"Añadir una fila");
bMas.onclick=function(){ filaB(tB.rows.length-1); auto(); };
H.appendChild(bMas);

/* Partes C y D */
[["parteC",E.parteC],["parteD",E.parteD]].forEach(function(x){
  var r=x[0], P=x[1];
  H.appendChild(cabecera(P.titulo,P.puntos,r));
  P.preguntas.forEach(function(q,i){ preg(q[0],q[1],q[2],5,r+".preguntas."+i); });
});
H.appendChild(ed(el("p",{"class":"pie"},esc(E.pie)),"pie"));

/* ---------- autoguardado ---------- */
function todos(){ return Array.prototype.slice.call(document.querySelectorAll("[data-id]")); }
function auto(){ todos().forEach(function(t){ if(t.tagName==="TEXTAREA"){ t.style.height="auto"; t.style.height=(t.scrollHeight+2)+"px"; } }); }
function datos(){ var o={sello:E.sello,ts:Date.now(),r:{}}; todos().forEach(function(t){ o.r[t.getAttribute("data-id")]=t.value; }); return o; }
function pon(o){ if(!o||!o.r) return; todos().forEach(function(t){ var v=o.r[t.getAttribute("data-id")]; if(v!=null) t.value=v; }); auto(); }
var tg=null;
function guarda(){ clearTimeout(tg); tg=setTimeout(function(){
  try{ localStorage.setItem(CLAVE,JSON.stringify(datos()));
       $("#est").textContent="· guardado a las "+new Date().toLocaleTimeString("es-ES").slice(0,5);
  }catch(x){ $("#est").textContent="· NO SE PUEDE GUARDAR EN ESTE NAVEGADOR"; $("#est").style.color="#ff9b8a"; }
},400); }
document.addEventListener("input",function(ev){ if(ev.target.getAttribute && ev.target.getAttribute("data-id")!=null){ if(ev.target.tagName==="TEXTAREA"){ ev.target.style.height="auto"; ev.target.style.height=(ev.target.scrollHeight+2)+"px"; } guarda(); } });
(function(){ try{ var t=localStorage.getItem(CLAVE); if(t){ var o=JSON.parse(t);
   if(o.sello===E.sello){ var faltan=Object.keys(o.r).filter(function(k){ return !document.querySelector('[data-id="'+k+'"]'); });
     faltan.forEach(function(k){ var m=/^B(\d+)_/.exec(k); if(m) while(tB.rows.length-1<=+m[1]) filaB(tB.rows.length-1); });
     pon(o); $("#est").textContent="· recuperado lo que había escrito"; }
 } }catch(x){} auto(); })();
window.addEventListener("beforeunload",function(){ try{ localStorage.setItem(CLAVE,JSON.stringify(datos())); }catch(x){} });

/* ---------- botones ---------- */
function av(t){ var a=$("#aviso"); a.textContent=t; a.classList.add("on"); setTimeout(function(){ a.classList.remove("on"); },3000); }
function limpia(s){ return String(s||"").replace(/[\\\/:*?"<>|]+/g,"-").trim().slice(0,60); }
function nombreArch(){ var v=document.querySelector('[data-id="_nombre"]').value; return "Prueba UT3"+(v?" - "+limpia(v):""); }
$("#bPdf").onclick=function(){ try{ localStorage.setItem(CLAVE,JSON.stringify(datos())); }catch(x){} window.print(); };
$("#bGua").onclick=function(){
  var b=new Blob([JSON.stringify(datos(),null,1)],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=nombreArch()+".respuestas.json"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); av("Copia de seguridad descargada en tu carpeta de Descargas. Recuerda que la entrega es el PDF.");
};
$("#bAbr").onclick=function(){ $("#fArch").value=""; $("#fArch").click(); };
$("#fArch").onchange=function(){ var f=this.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var o=JSON.parse(r.result);
      Object.keys(o.r||{}).forEach(function(k){ var m=/^B(\d+)_/.exec(k); if(m) while(tB.rows.length-1<=+m[1]) filaB(tB.rows.length-1); });
      pon(o); guarda(); av("Respuestas cargadas."); }catch(x){ av("Ese archivo no es de esta prueba."); } };
  r.readAsText(f); };
$("#bBor").onclick=function(){ if(!confirm("¿Borrar todo lo escrito y empezar de cero? No se puede deshacer.")) return;
  todos().forEach(function(t){ t.value=""; }); try{ localStorage.removeItem(CLAVE); }catch(x){} auto(); av("Hoja vacía."); };

/* ---------- visualización ---------- */
var VIS="rea-prueba-ut3-vista", vista={w:880,z:1};
try{ var vv=JSON.parse(localStorage.getItem(VIS)||"null"); if(vv&&vv.w) vista=vv; }catch(x){}
function aplicaVista(){
